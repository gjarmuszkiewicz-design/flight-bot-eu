<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logowanie · Panel SEO/AEO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css?v=1">
<script src="/static/js/app.js?v=1"></script>
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="logo"><span class="logo-mark">S</span><span>Panel SEO/AEO<small>{{ settings.brand_name }}</small></span></div>
    {% for f in flashes %}<div class="callout critical" style="margin-bottom:14px">{{ f.msg }}</div>{% endfor %}
    {% if not configured %}
      <div class="callout warning"><div><b>Panel nie ma ustawionego hasła.</b><br>Ustaw zmienną środowiskową <code>ADMIN_PASSWORD</code> (oraz opcjonalnie <code>ADMIN_USER</code>) i uruchom aplikację ponownie.</div></div>
    {% else %}
    <form method="post" action="/login" class="stack" style="gap:14px">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field">Login<input type="text" name="username" autocomplete="username" required autofocus></label>
      <label class="field">Hasło<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit" style="height:42px">Zaloguj się</button>
    </form>
    {% endif %}
  </div>
</div>
</body>
</html>
